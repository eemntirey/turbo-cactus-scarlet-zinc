name: Tauri — Windows + Android

on:
  workflow_dispatch:
    inputs:
      hepta_app_url:
        description: "URL HTTPS publique de l'application Hepta"
        required: true
        type: string

permissions:
  contents: read

env:
  HEPTA_APP_URL: ${{ inputs.hepta_app_url }}

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate application
        run: |
          npm run typecheck
          npm test

      - name: Validate and inject Hepta URL
        shell: pwsh
        run: |
          $u = [Uri]$env:HEPTA_APP_URL
          if ($u.Scheme -ne "https" -or [string]::IsNullOrWhiteSpace($u.Host)) {
            throw "HEPTA_APP_URL doit être une URL HTTPS valide."
          }
          node -e "const fs=require('fs'); const p='src-tauri/tauri.conf.json'; const c=JSON.parse(fs.readFileSync(p,'utf8')); c.build.frontendDist=process.env.HEPTA_APP_URL; fs.writeFileSync(p, JSON.stringify(c,null,2)+'\n');"

      - name: Generate Tauri icons
        run: npx --yes @tauri-apps/cli@2.12.1 icon public/favicon.svg

      - name: Build Windows NSIS + MSI
        run: npx --yes @tauri-apps/cli@2.12.1 build --ci

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: hepta-windows
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  android:
    name: Android APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmdline-tools;latest"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate application
        run: |
          npm run typecheck
          npm test

      - name: Validate and inject Hepta URL
        shell: bash
        run: |
          case "$HEPTA_APP_URL" in
            https://?*) ;;
            *) echo "HEPTA_APP_URL doit être une URL HTTPS valide." >&2; exit 1 ;;
          esac
          node -e "const fs=require('fs'); const p='src-tauri/tauri.conf.json'; const c=JSON.parse(fs.readFileSync(p,'utf8')); c.build.frontendDist=process.env.HEPTA_APP_URL; fs.writeFileSync(p, JSON.stringify(c,null,2)+'\n');"

      - name: Initialize Android project
        run: npx --yes @tauri-apps/cli@2.12.1 android init --ci

      - name: Generate Tauri icons
        run: npx --yes @tauri-apps/cli@2.12.1 icon public/favicon.svg

      - name: Build universal APK
        run: npx --yes @tauri-apps/cli@2.12.1 android build --ci --apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: hepta-android-apk
          if-no-files-found: error
          path: |
            src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
