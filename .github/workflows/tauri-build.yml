name: Tauri — Windows + Android

on:
  push:
    branches:
      - tauri-packaging
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate application
        run: |
          npm run typecheck
          npm test

      - name: Generate Tauri icons
        run: npx --yes @tauri-apps/cli@2.12.1 icon public/favicon.svg

      - name: Build Windows NSIS
        run: npx --yes @tauri-apps/cli@2.12.1 build --ci

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: hepta-windows
          if-no-files-found: error
          path: src-tauri/target/release/bundle/nsis/*.exe

  android:
    name: Android APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmdline-tools;latest" "ndk;30.0.16248370"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate application
        run: |
          npm run typecheck
          npm test

      - name: Generate Tauri Android project
        run: npx --yes @tauri-apps/cli@2.12.1 android init --ci

      - name: Generate Tauri icons
        run: npx --yes @tauri-apps/cli@2.12.1 icon public/favicon.svg

      - name: Build universal release APK
        run: npx --yes @tauri-apps/cli@2.12.1 android build --ci --apk

      - name: Sign APK for direct installation
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*release-unsigned.apk' | head -n 1)"
          test -n "$APK"
          test -f "$APK"

          KS="$RUNNER_TEMP/hepta-debug.keystore"
          keytool -genkeypair -v             -keystore "$KS"             -storetype JKS             -storepass android             -keypass android             -alias androiddebugkey             -keyalg RSA             -keysize 2048             -validity 10000             -dname "CN=Android Debug,O=Android,C=US" >/dev/null 2>&1 || true

          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          ALIGNED="$RUNNER_TEMP/hepta-aligned.apk"
          SIGNED="$RUNNER_TEMP/hepta.apk"

          "$BUILD_TOOLS/zipalign" -P 16 -f 4 "$APK" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" sign             --ks "$KS"             --ks-pass pass:android             --key-pass pass:android             --ks-key-alias androiddebugkey             --out "$SIGNED"             "$ALIGNED"

          "$BUILD_TOOLS/apksigner" verify --verbose "$SIGNED"
          cp "$SIGNED" "$GITHUB_WORKSPACE/Hepta-Android.apk"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: hepta-android-apk
          if-no-files-found: error
          path: Hepta-Android.apk
